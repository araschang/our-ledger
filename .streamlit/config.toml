# 視覺主題：石墨黑底 + 柿橙×靛藍雙人色
[theme]
base = "dark"
primaryColor = "#E8834E"                 # 柿橙（互動色 / Diana）
backgroundColor = "#16181D"              # 石墨黑
secondaryBackgroundColor = "#1E2128"     # 石墨面（卡片/輸入框）
textColor = "#E9EAEE"
linkColor = "#E8834E"
borderColor = "#2C303A"
baseRadius = "0.75rem"
chartCategoricalColors = [
  "#E8834E", "#5B8DBE", "#6FAF7C", "#E4B95B", "#B07CC6",
  "#D96A55", "#8A9A5B", "#C98CA7", "#7FA6A0", "#A98467",
]

[theme.sidebar]
backgroundColor = "#121419"
