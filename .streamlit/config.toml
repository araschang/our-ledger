# 視覺主題：淺色卡片式（照舊版 our-ledger 的設計）
[theme]
base = "light"
primaryColor = "#3B6FE0"                 # 藍（互動色）
backgroundColor = "#F6F6F4"              # 淺灰底
secondaryBackgroundColor = "#FFFFFF"     # 白卡片
textColor = "#1C1C1E"
linkColor = "#3B6FE0"
borderColor = "#E7E7E4"
baseRadius = "0.75rem"
chartCategoricalColors = [
  "#3B6FE0", "#E8823E", "#34A853", "#E5484D", "#8E67D6",
  "#E5A63B", "#5B8DBE", "#C98CA7", "#7FA6A0", "#A98467",
]

[theme.sidebar]
backgroundColor = "#FFFFFF"
